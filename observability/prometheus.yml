global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: preauth-api
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics

  - job_name: preauth-worker
    static_configs:
      - targets: ["worker:8001"]
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]
